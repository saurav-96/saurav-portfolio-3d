<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">YouTube thumbnail concept: Automate the boring stuff</title>
  <desc id="d">Self-initiated concept thumbnail for a fictional tech channel about workflow automation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0A1F"/><stop offset="1" stop-color="#1E1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".75"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/></pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- headline -->
  <g font-family="Impact, 'Arial Black', 'Segoe UI', sans-serif" font-weight="900">
    <text x="64" y="190" font-size="120" fill="#fff" letter-spacing="1">STOP DOING</text>
    <text x="64" y="320" font-size="150" fill="url(#acc)" letter-spacing="1">THIS BY</text>
    <text x="64" y="450" font-size="150" fill="#fff" letter-spacing="1">HAND.</text>
  </g>
  <g transform="translate(64 500)">
    <rect width="470" height="76" rx="14" fill="#FACC15"/>
    <text x="235" y="52" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="42" fill="#0B0A1F">AUTOMATE IT IN 10 MIN</text>
  </g>
  <text x="64" y="640" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#C4B5FD" font-weight="600">Concept thumbnail  ·  fictional channel "Flowbyte"</text>

  <!-- workflow diagram -->
  <g transform="translate(700 130)">
    <path d="M110 110 C 220 110 220 280 330 280" fill="none" stroke="#22D3EE" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
    <path d="M110 450 C 220 450 220 280 330 280" fill="none" stroke="#A78BFA" stroke-width="6" stroke-dasharray="4 14" stroke-linecap="round"/>
    <path d="M330 280 H 440" stroke="#FACC15" stroke-width="8" stroke-linecap="round"/>

    <!-- node 1: inbox -->
    <g transform="translate(0 40)"><rect width="150" height="140" rx="26" fill="#14123A" stroke="#22D3EE" stroke-width="4"/>
      <rect x="34" y="42" width="82" height="56" rx="8" fill="none" stroke="#22D3EE" stroke-width="6"/>
      <path d="M34 50 L75 80 L116 50" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linejoin="round"/></g>
    <!-- node 2: spreadsheet -->
    <g transform="translate(0 380)"><rect width="150" height="140" rx="26" fill="#14123A" stroke="#A78BFA" stroke-width="4"/>
      <rect x="32" y="30" width="86" height="80" rx="8" fill="none" stroke="#A78BFA" stroke-width="6"/>
      <path d="M32 58 H118 M32 84 H118 M75 30 V110" stroke="#A78BFA" stroke-width="5"/></g>
    <!-- center bot -->
    <g transform="translate(250 190)"><rect width="180" height="180" rx="40" fill="#7C3AED" stroke="#fff" stroke-width="5"/>
      <rect x="38" y="52" width="104" height="76" rx="22" fill="#0B0A1F"/>
      <circle cx="68" cy="88" r="11" fill="#22D3EE"/><circle cx="112" cy="88" r="11" fill="#22D3EE"/>
      <path d="M90 52 V30" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle cx="90" cy="24" r="9" fill="#FACC15"/></g>
    <!-- output -->
    <g transform="translate(440 210)"><rect width="140" height="140" rx="26" fill="#FACC15"/>
      <path d="M40 74 L62 96 L102 48" fill="none" stroke="#0B0A1F" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <!-- corner tag -->
  <g transform="translate(1100 40)"><rect width="140" height="44" rx="22" fill="#000" fill-opacity=".55" stroke="#fff" stroke-opacity=".25"/>
    <text x="70" y="29" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">CONCEPT</text></g>
</svg>
