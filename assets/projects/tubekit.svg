<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-labelledby="t">
  <title id="t">Illustration of the TubeKit extension controls under a video timeline</title>
  <defs>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F2347"/><stop offset="1" stop-color="#0B0C1F"/></linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7C6BFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect width="1440" height="900" fill="#0A0B1E"/>
  <rect x="120" y="90" width="1200" height="675" rx="22" fill="url(#v)"/>
  <circle cx="720" cy="380" r="76" fill="#fff" fill-opacity=".12"/>
  <path d="M700 340 L760 380 L700 420Z" fill="#fff" fill-opacity=".9"/>
  <!-- control bar -->
  <rect x="120" y="640" width="1200" height="125" rx="0" fill="#000" fill-opacity=".35"/>
  <rect x="150" y="660" width="1140" height="6" rx="3" fill="#fff" fill-opacity=".25"/>
  <rect x="150" y="660" width="520" height="6" rx="3" fill="#FF3B3B"/>
  <circle cx="670" cy="663" r="9" fill="#FF3B3B"/>
  <g fill="#fff" fill-opacity=".85"><path d="M160 700 l26 15 -26 15z"/><rect x="215" y="702" width="64" height="8" rx="4"/><rect x="1240" y="702" width="40" height="28" rx="6" fill="none" stroke="#fff" stroke-width="4"/></g>
  <!-- extension pill -->
  <g transform="translate(450 686)">
    <rect width="540" height="62" rx="31" fill="#0A0B1E" fill-opacity=".72" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
    <g font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">
      <text x="62" y="39">« </text>
      <text x="150" y="39">1.25x</text>
      <text x="238" y="39"> »</text>
    </g>
    <rect x="100" y="12" width="100" height="38" rx="19" fill="none" stroke="url(#p)" stroke-width="2"/>
    <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="320" y="20" width="34" height="24" rx="5"/><circle cx="337" cy="32" r="6"/>
      <rect x="400" y="20" width="34" height="24" rx="5"/><path d="M404 40 l10 -10 8 8 6 -5 6 7"/>
    </g>
  </g>
  <text x="720" y="835" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#A3A6C7">Interface illustration — speed stepper, frame capture, thumbnail tools</text>
</svg>
