  <text x="545" y="134" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700">Web &amp; File Scraper</text>
  <text x="545" y="152" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">BeautifulSoup + Async HTTP</text>
