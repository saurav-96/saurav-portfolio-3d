  <text x="134" y="388" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700">Python &amp; AI Workflow Sandbox</text>
  <text x="134" y="412" fill="#94A3B8" font-family="Inter, sans-serif" font-size="13">Personal R&amp;D scripts for file organization, batch media processing, and LLM-assisted task automation.</text>
