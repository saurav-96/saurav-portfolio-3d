  <text x="122" y="80" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="11">pipeline_runner.py — Python 3.12</text>
  <text x="68" y="118" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="12">import <tspan fill="#F8FAFC">asyncio, httpx</tspan></text>
  <text x="68" y="142" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-size="12">async def <tspan fill="#F8FAFC">run_workflow(task):</tspan></text>
  <text x="86" y="166" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="12">parsed = <tspan fill="#A855F7">await</tspan> extract_schema(task)</text>
  <text x="86" y="190" fill="#94A3B8" font-family="JetBrains Mono, monospace" font-size="12">report = synthesize_digest(parsed)</text>
  <text x="86" y="214" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="12">return <tspan fill="#F8FAFC">{"status": "ok", "items": len(report)}</tspan></text>
  <rect x="68" y="242" width="330" height="44" rx="10" fill="rgba(6,182,212,0.1)" stroke="rgba(6,182,212,0.3)"/>
  <text x="84" y="268" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-size="11">✓ [LAB] 3 automation scripts verified locally</text>
