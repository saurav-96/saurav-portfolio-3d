<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090812"/>
      <stop offset="50%" stop-color="#191130"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </linearGradient>
    <linearGradient id="gradBrand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#cbg)"/>
  <!-- Card 1: Brand Identity -->
  <rect x="44" y="48" width="225" height="190" rx="16" fill="#111222" stroke="rgba(168,85,247,0.35)" stroke-width="1.5"/>
  <circle cx="156" cy="118" r="38" fill="url(#gradBrand)"/>
  <polygon points="156,92 134,134 178,134" fill="#07070C"/>
  <text x="68" y="186" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="15" font-weight="700">Brand Identity &amp; Logos</text>
  <text x="68" y="206" fill="#94A3B8" font-family="Inter, sans-serif" font-size="11">Geometric marks &amp; color systems</text>
  <!-- Card 2: YouTube Thumbnail Concept -->
  <rect x="288" y="48" width="468" height="190" rx="16" fill="#111222" stroke="rgba(6,182,212,0.35)" stroke-width="1.5"/>
  <rect x="310" y="70" width="210" height="146" rx="12" fill="url(#gradBrand)" opacity="0.85"/>
  <polygon points="402,124 402,162 434,143" fill="#FFFFFF"/>
  <text x="542" y="106" fill="#22D3EE" font-family="JetBrains Mono, monospace" font-size="11">HIGH-CTR THUMBNAILS</text>
  <text x="542" y="134" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">Visual Storytelling</text>
  <text x="542" y="160" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Contrast hierarchy, expressive</text>
  <text x="542" y="178" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">typography &amp; custom composites.</text>
  <!-- Card 3: Event Poster & Social Suite -->
  <rect x="44" y="258" width="450" height="192" rx="16" fill="#111222" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="72" y="302" fill="#C084FC" font-family="JetBrains Mono, monospace" font-size="11">PROMOTIONAL CAMPAIGNS</text>
  <text x="72" y="334" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="22" font-weight="700">Posters &amp; Social Media Kits</text>
  <text x="72" y="362" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Editorial layouts, hackathon posters, and product</text>
  <text x="72" y="380" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">launch visuals crafted in Figma and Canva.</text>
  <rect x="72" y="398" width="110" height="28" rx="14" fill="rgba(168,85,247,0.18)" stroke="rgba(168,85,247,0.4)"/>
  <text x="92" y="416" fill="#E9D5FF" font-family="Inter, sans-serif" font-size="11" font-weight="600">Figma • Canva</text>
  <!-- Card 4: Color & Typography Swatch -->
  <rect x="514" y="258" width="242" height="192" rx="16" fill="#111222" stroke="rgba(168,85,247,0.3)" stroke-width="1.5"/>
  <circle cx="564" cy="316" r="22" fill="#7C3AED"/>
  <circle cx="604" cy="316" r="22" fill="#A855F7"/>
  <circle cx="644" cy="316" r="22" fill="#06B6D4"/>
  <circle cx="684" cy="316" r="22" fill="#F8FAFC"/>
  <text x="544" y="378" fill="#F8FAFC" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700">Visual Systems</text>
  <text x="544" y="402" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">Typography scales, grid</text>
  <text x="544" y="420" fill="#94A3B8" font-family="Inter, sans-serif" font-size="12">composition &amp; art direction.</text>
</svg>
